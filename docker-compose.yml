services:
  db:
    image: postgres:15-alpine
    container_name: dots_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dots
    # Port 5432 intentionally NOT exposed — accessible only within Docker network
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d dots -c '\\q' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dots_server
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dots?schema=public
      - JWT_SECRET=supersecret_dots_key_prod
      - PORT=3001
      - ADMIN_USERNAMES=alex
      - STRIPE_SECRET_KEY=sk_live_YOUR_KEY_HERE
      - STRIPE_WEBHOOK_SECRET=whsec_YOUR_WEBHOOK_SECRET_HERE
      - CLIENT_URL=https://dotsclash.xyz
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dots_client
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - server

volumes:
  pgdata:
