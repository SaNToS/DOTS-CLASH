services:
  db:
    image: postgres:15-alpine
    container_name: dots_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dots
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dots_server
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dots?schema=public
      - JWT_SECRET=supersecret_dots_key_prod
      - PORT=3001
    depends_on:
      - db
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dots_client
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - server

volumes:
  pgdata:
